name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install --require-hashes -r requirements-dev.lock && pip install --no-deps -e .
      - run: python -m pytest -q
      - run: npm ci && npm run build && npx playwright install --with-deps chromium && npx playwright test
        working-directory: frontend
      - name: Build the evaluated artifact into a container
        run: docker build -t hanoi-rentals:ci .
      - name: Container readiness and prediction smoke test
        run: |
          docker run -d --name rental-ci -p 127.0.0.1:8001:8000 hanoi-rentals:ci
          python scripts/smoke.py --url http://127.0.0.1:8001
      - if: always()
        run: docker logs rental-ci 2>/dev/null || true; docker rm -f rental-ci 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-results
          path: frontend/test-results/
          retention-days: 14
