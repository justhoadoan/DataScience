name: Monthly data and model evaluation
on:
  schedule:
    # Just after month-end: covers the entire completed month in Vietnam.
    - cron: '35 0 1 * *'
      timezone: Asia/Ho_Chi_Minh
  workflow_dispatch:
    inputs:
      since:
        description: 'First posting date YYYY-MM-DD; blank means start of previous month'
        required: false
        type: string
      until:
        description: 'Last posting date YYYY-MM-DD; blank means end of previous month'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: rental-monthly-state
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps -e .
      - name: Determine the completed month or manual backfill window
        id: window
        env:
          INPUT_SINCE: ${{ inputs.since }}
          INPUT_UNTIL: ${{ inputs.until }}
        run: python scripts/month_window.py >> "$GITHUB_OUTPUT"
      - name: Restore durable dataset, benchmark and registry
        id: restore
        run: python scripts/github_state.py restore
      - name: Crawl, audit, EDA, train and apply the promotion policy
        env:
          SINCE: ${{ steps.window.outputs.since }}
          UNTIL: ${{ steps.window.outputs.until }}
        run: |
          python - <<'PYCODE'
          import os
          from datetime import date
          from pathlib import Path
          from hanoi_rentals.features.dates import TARGET_END
          from hanoi_rentals.ingestion.crawler import crawl
          from hanoi_rentals.operations.pipeline import train

          since = date.fromisoformat(os.environ["SINCE"])
          until = min(date.fromisoformat(os.environ["UNTIL"]), TARGET_END)
          summary = crawl(Path.cwd(), since, until) if since <= until else None
          train(Path.cwd(), summary)
          PYCODE
      - name: Record model evaluation
        run: python scripts/workflow_summary.py
      - name: Evaluate the date-feature candidate through November 2026
        run: python -m hanoi_rentals.cli train-temporal
      - name: Summarize November chronological validation
        run: python -m hanoi_rentals.cli evaluate-temporal
      - name: Preserve updated state even when the candidate is rejected or a later step fails
        # Never save after a failed restore: that would replace good state with a partial one.
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: python scripts/github_state.py save --tag "rental-state-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: monthly-evaluation-${{ github.run_id }}
          path: reports/
          retention-days: 90
