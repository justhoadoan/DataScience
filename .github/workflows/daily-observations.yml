name: Daily price observations through December 2026
on:
  schedule:
    # 06:35 Vietnam time; GitHub cron is UTC.
    - cron: '35 23 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Shared with monthly evaluation: a state release must have only one writer.
  group: rental-monthly-state
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps -e .
      - name: Check the collection deadline in Vietnam
        id: window
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from hanoi_rentals.features.dates import TARGET_END, today_hanoi
          print(f"active={str(today_hanoi() <= TARGET_END).lower()}")
          PY
      - name: Restore durable observations and registry
        if: steps.window.outputs.active == 'true'
        id: restore
        run: python scripts/github_state.py restore
      - name: Collect accessible listings and retain each daily price observation
        if: steps.window.outputs.active == 'true'
        run: python -m hanoi_rentals.cli crawl --since 2025-11-01 --until 2026-12-31
      - name: Save collected state, including partial source results
        if: always() && steps.window.outputs.active == 'true' && steps.restore.outcome == 'success'
        run: python scripts/github_state.py save --tag "rental-observations-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.window.outputs.active == 'true'
        with:
          name: observation-coverage-${{ github.run_id }}
          path: |
            reports/temporal_coverage.json
            reports/crawl_latest.json
          retention-days: 90
